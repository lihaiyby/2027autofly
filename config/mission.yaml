# 任务参数：高度、速度、航线、时限、重试
# 全部键都对应 autofly.config.MissionConfig 的字段，缺省用代码里的默认值。

takeoff_z: 1.2
search_z: 1.2          # 低空巡航：LIO 在此高度约束充足，不易发散
drop_z: 2.3             # 圆环完整入画
open_loop_fallback: true
ring_near_tol: 0.28
ring_stable_frames: 5
search_dwell: 2.5
release_z: 0.90        # 下降到此高度释放（不触地）
min_safe_z: 0.45       # 释放高度下限
corridor_entry_z: 1.6

max_xy_speed: 0.6
max_jerk: 2.0

want_classes: ["red_cross", "bridge", "panzer"]

# 官方固定地图（field_with_targets.world）里的靶标真值坐标，搜索未命中时兜底
known_targets:
  red_cross: [1.0449, -0.4647]
  bridge:    [4.0325,  1.8622]
  panzer:    [7.0512, -4.1322]
max_targets: 3

search_timeout: 420
align_timeout: 25        # 高空停留尽量短：2.3 m 处 LIO 会漂
vision_wait: 150

takeoff_retries: 3
drop_retries: 1
drop_reset_offset: 0.8

goto_tol: 0.40
center_gate_px: 400
chase_gain: 0.55
lane_tol: 0.55
ready_frames: 3

# 割草机搜索航线（依次经过的端点）
search_lanes:
  - [0.8, -4.0]
  - [0.8,  4.0]
  - [2.6,  4.0]
  - [2.6, -4.0]
  - [4.4, -4.0]
  - [4.4,  4.0]
  - [6.2,  4.0]
  - [6.2, -4.0]
  - [7.2, -4.0]

# 走廊 11 段：门 A 在 y=1.6 走 x<8.8，门 B 在 y=-1.6 走 x>8.7
corridor:
  - [8.70,  4.30, 1.20]
  - [9.10,  3.60, 1.10]
  - [9.15,  2.80, 1.00]
  - [8.80,  2.20, 1.00]
  - [8.45,  1.60, 1.00]
  - [8.45,  0.90, 1.00]
  - [8.45,  0.20, 1.00]
  - [8.80, -0.70, 1.00]
  - [9.15, -1.60, 1.00]
  - [8.85, -2.50, 1.00]
  - [8.60, -3.40, 1.00]

exit_pad: [8.75, -4.20]
